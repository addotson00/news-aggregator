[project]
name = "newscanner"
version = "0.1.0"
description = "Config-driven news aggregator that publishes static JSON for a GitHub Pages site"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
newscanner = "newscanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newscanner"]
