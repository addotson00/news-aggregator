<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Generated by `newscanner run` from src/newscanner/site/topic.html; edits here are overwritten. -->
  <base href="../">
  <meta name="newscanner-topic" content="AI-HE">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI in Higher Education</title>
  <meta name="description" content="Artificial intelligence coverage from higher-ed and education news outlets.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand">
        <a class="back" href="./">← All aggregators</a>
        <h1 id="topic-title">AI in Higher Education</h1>
        <p id="topic-desc" class="muted"></p>
      </div>
      <label class="topic-picker" id="topic-picker" hidden>
        <span class="sr-only">Switch aggregator</span>
        <select id="topic-select"></select>
      </label>
    </div>
    <div class="wrap search-row">
      <input id="search" type="search" placeholder="Search titles, summaries, sources… (use &quot;quotes&quot; for phrases)" autocomplete="off">
    </div>
  </header>

  <main class="wrap layout">
    <aside class="filters">
      <details id="filters-details" open>
        <summary>Filters</summary>

        <section class="filter-block">
          <h2>Show</h2>
          <div class="seg" role="radiogroup" id="show-seg">
            <button type="button" data-show="match" aria-pressed="true">Keyword matches</button>
            <button type="button" data-show="all" aria-pressed="false">All articles</button>
          </div>
        </section>

        <section class="filter-block">
          <h2>Published</h2>
          <div class="seg seg-wrap" id="days-seg">
            <button type="button" data-days="1">24h</button>
            <button type="button" data-days="7">7 days</button>
            <button type="button" data-days="0" id="days-current">30 days</button>
            <button type="button" data-days="-1" title="Includes archived articles older than the current window">All time</button>
          </div>
          <p id="archive-note" class="muted small" hidden></p>
        </section>

        <section class="filter-block">
          <h2>Tags <button type="button" class="link" data-clear="tags">clear</button></h2>
          <ul id="tag-list" class="facet"></ul>
        </section>

        <section class="filter-block">
          <h2>Sources <button type="button" class="link" data-clear="sources">clear</button></h2>
          <ul id="source-list" class="facet"></ul>
        </section>
      </details>
    </aside>

    <section class="results" aria-live="polite">
      <div class="results-bar">
        <span id="count" class="muted"></span>
        <button type="button" id="reset" class="link">Reset all filters</button>
      </div>
      <ol id="articles" class="articles"></ol>
      <button type="button" id="more" class="more" hidden>Show more</button>
      <p id="empty" class="empty" hidden>No articles match these filters.</p>
    </section>
  </main>

  <footer class="wrap site-footer">
    <details>
      <summary id="health-summary">Source status</summary>
      <ul id="health" class="health"></ul>
    </details>
    <p class="muted small">Headlines and short excerpts link to the original publishers. Updated <span id="updated">—</span>.</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
