<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Aggregators</title>
  <meta name="description" content="Daily keyword-tagged news aggregators">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row hub-header">
      <div class="brand">
        <h1>News Aggregators</h1>
        <p class="muted">Daily, keyword-tagged news collections. Pick one to search and filter.</p>
      </div>
    </div>
  </header>

  <main class="wrap hub">
    <ul id="topics" class="hub-list"></ul>
    <p id="empty" class="empty" hidden>No aggregators published yet.</p>
  </main>

  <script>
  (async () => {
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let manifest;
    try {
      manifest = await (await fetch("data/manifest.json", { cache: "no-cache" })).json();
    } catch {
      document.getElementById("empty").hidden = false;
      return;
    }
    const fmt = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });
    document.getElementById("topics").innerHTML = manifest.topics.map((t) => {
      const active = t.sources.filter((s) => s.state !== "disabled");
      const ok = active.filter((s) => s.state === "ok").length;
      const archived = (t.archive || []).reduce((n, m) => n + m.count, 0);
      return `<li class="card hub-card">
        <h2><a href="${encodeURIComponent(t.slug)}/">${esc(t.title)}</a></h2>
        <p>${esc(t.description)}</p>
        <div class="meta">
          <span><strong>${t.match_count}</strong> keyword matches</span><span>·</span>
          <span>${t.article_count} articles (last ${t.retention_days || 30} days)</span><span>·</span>
          <span>${archived} archived</span><span>·</span>
          <span>${ok}/${active.length} sources OK</span><span>·</span>
          <span>updated ${esc(fmt.format(new Date(t.updated_at)))}</span>
        </div>
      </li>`;
    }).join("");
    document.getElementById("empty").hidden = manifest.topics.length > 0;
  })();
  </script>
</body>
</html>
