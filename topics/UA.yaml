    page_fetch_limit: 3
    page_delay_seconds: 20

  # --- Headlines only ---
  - id: alaskapublic
    name: Alaska Public Media
    homepage: https://alaskapublic.org/
    type: news_sitemap
    url: https://alaskapublic.org/news-sitemap-content.xml
    text_check: false  # robots.txt signals article pages are off-limits to bots

  - id: kmxt
    name: KMXT (Kodiak)
    homepage: https://www.kmxt.org/
    type: news_sitemap
    url: https://www.kmxt.org/news-sitemap-content.xml

  # --- Not collectable without scraping or against site rules ---
  - id: arctictoday
    name: Arctic Today
    homepage: https://www.arctictoday.com/
    type: rss
    url: https://www.arctictoday.com/feed/
    enabled: false
    note: robots.txt disallows all feeds.

  - id: kvak
    name: KVAK Radio (Valdez)
    homepage: https://www.kvakradio.com/
    type: rss
    url: https://www.kvakradio.com/feed/
    enabled: false
    note: robots.txt disallows the feed.

  - id: alaskalandmine
    name: Alaska Landmine
    homepage: https://alaskalandmine.com/
    type: rss
    url: https://alaskalandmine.com/feed/
    enabled: false
    note: Blocks automated clients (HTTP 403).

  - id: sitkasentinel
    name: Daily Sitka Sentinel
    homepage: https://sitkasentinel.com/
    type: news_sitemap
    url: https://sitkasentinel.com/sitemaps/sitemaps-r2-googlenews-sitka-sentinel-1.xml
    enabled: false
    note: News sitemap is ~1.4 MB and malformed; feeds return 403.

# UA mentions. Acronyms are case-sensitive regexes so "UAF" matches but words
# like "quality" don't. Note: "UAS" is also used for drones (unmanned aircraft
# systems); UAF runs Alaska's drone program, so most such hits are still UA news.
keywords:
  UA system:
    - University of Alaska
    # Bare "UA" is reliable in Alaska headlines, but in article bodies it also means
    # United Artists, United Airlines, Under Armour... so in text require UA phrasing.
    - term: /\bUA\b(?!\s+(?:[Ff]lights?|[Oo]utages?|[Aa]irlines?|[Pp]ilots?))/
      scope: headline
    - /\bUA(?:'s)? (?:system|[Bb]oard|[Rr]egents?|[Pp]resident|[Ff]oundation|[Ss]tatewide|campus(?:es)?|budget|faculty|students?|leadership|administration)\b/
    - UA Foundation
    - UA Board of Regents
    - University of Alaska Board of Regents
    - Alaska College of Education
  UAA:
    - /\bUAA\b/
    - Seawolves
    - Kenai Peninsula College
    - Kachemak Bay Campus
    - Kodiak College
    - Matanuska-Susitna College
    - Mat-Su College
    - Prince William Sound College
    - /\bANSEP\b/
    - Alaska Native Science & Engineering Program
    - Alaska Native Science and Engineering Program
    - Institute of Social and Economic Research
  UAF:
    - /\bUAF\b/
    - Nanooks
    - Geophysical Institute
    - International Arctic Research Center
    - Poker Flat Research Range
    - Museum of the North
    - Alaska Earthquake Center
    - Alaska Center for Energy and Power
    - Institute of Arctic Biology
    - Toolik Field Station
    - Alaska Satellite Facility
    - Alaska Sea Grant
    - Alaska Native Language Center
    - Fishery Industrial Technology Center
    - Large Animal Research Station
    - Kuskokwim Campus
    - Northwest Campus
    - Bristol Bay Campus
    - Chukchi Campus
    - Interior Alaska Campus
    - Community and Technical College
  UAS:
    - /\bUAS\b/
    - Ketchikan campus
    - Sitka campus
  # --- Facet tags (headline only, so a passing mention deep in a story doesn't tag it) ---
  Sports:
    scope: headline
    terms:
      - Seawolves
      - Nanooks
      - hockey
      - basketball
      - volleyball
      - gymnastics
      - skiing
      - ski*
      - rifle
      - cross-country
      - track and field
      - /\bGNAC\b/
      - /\bNCAA\b/
      - Division II
      - Governor's Cup
      - Shootout
      - coach*
      - tournament
      - playoff*
  Budget & governance:
    scope: headline
    terms:
      - budget
      - funding
      - regents
      - legislature
      - legislator*
      - lawmakers
      - tuition
      - cuts
      - accreditation
      - president
      - chancellor
  Research & science:
    scope: headline
    terms:
      - research*
      - scientist*
      - study
      - studies
      - data
      - grant
  Students & campus life:
    scope: headline
    terms:
      - student*
      - enrollment
      - graduat*
      - commencement
      - scholarship*
      - campus
      - dorm*
      - housing

match_groups:
  - UA system
  - UAA
  - UAF
  - UAS

exclude: []
