slug: UA
title: University of Alaska in the News
description: Alaska media coverage mentioning the University of Alaska system, UAA, UAF, or UAS.

# filter = keep only articles that mention UA somewhere (headline or article text).
mode: filter
retention_days: 90

# Alaska outlets publish at a slower pace than national higher-ed press; the
# tightest feed (Alaska's News Source) covers ~7 hours, so every 2 hours keeps
# overlap. The hourly Hermes fetch job skips this topic until it is due.
fetch_every_minutes: 120

# Search article text, not just headlines: use the feed's full text when it has
# it; otherwise read the article page (recent articles only, once each, politely
# paced). Only short snippets around matches are stored, never the article.
text_check: true
text_check_days: 14
page_fetch_limit: 25

# Tags hidden on the site until the viewer turns them back on (empty = show all).
hidden_tags: []

sources:
  # --- Full article text in the feed ---
  - id: adn
    name: Anchorage Daily News
    homepage: https://www.adn.com/
    type: rss
    url: https://www.adn.com/arc/outboundfeeds/rss/?outputType=xml

  - id: alaskabeacon
    name: Alaska Beacon
    homepage: https://alaskabeacon.com/
    type: rss
    url: https://alaskabeacon.com/feed/

  - id: alaskacurrent
    name: The Alaska Current
    homepage: https://thealaskacurrent.com/
    type: rss
    url: https://thealaskacurrent.com/feed/

  - id: alaskasnewssource
    name: Alaska's News Source
    homepage: https://www.alaskasnewssource.com/
    type: rss
    url: https://www.alaskasnewssource.com/arc/outboundfeeds/rss/?outputType=xml

  - id: ktoo
    name: KTOO
    homepage: https://www.ktoo.org/
    type: rss
    url: https://www.ktoo.org/feed/

  - id: matsusentinel
    name: Mat-Su Sentinel (formerly the Frontiersman)
    homepage: https://www.matsusentinel.com/
    type: rss
    url: https://www.matsusentinel.com/rss/

  # --- Teaser-only feeds: article pages are read to check the text ---
  - id: newsminer
    name: Fairbanks Daily News-Miner
    homepage: https://www.newsminer.com/
    type: rss
    url: https://www.newsminer.com/search/?f=rss&t=article&l=50&s=start_time&sd=desc

  - id: juneauindependent
    name: Juneau Independent
    homepage: https://www.juneauindependent.com/
    type: rss
    url: https://www.juneauindependent.com/blog-feed.xml

  - id: anchoragepress
    name: Anchorage Press
    homepage: https://anchoragepress.com/
    type: rss
    url: https://anchoragepress.com/rss.xml

  - id: peninsulaclarion
    name: Peninsula Clarion
    homepage: https://www.peninsulaclarion.com/
    type: rss
    url: https://www.peninsulaclarion.com/feed/

  - id: ketchikandailynews
    name: Ketchikan Daily News
    homepage: https://www.ketchikandailynews.com/
    type: rss
    url: https://www.ketchikandailynews.com/search/?f=rss&t=article&l=50&s=start_time&sd=desc
    # Very strict rate limit (429 after a handful of requests, lasting hours):
    # read few article pages per run, slowly.
    page_fetch_limit: 3
    page_delay_seconds: 20

  - id: nomenugget
    name: The Nome Nugget
    homepage: http://www.nomenugget.com/
    type: rss
    url: https://www.nomenugget.com/rss.xml

  - id: mustreadalaska
    name: Must Read Alaska
    homepage: https://mustreadalaska.com/
    type: rss
    url: https://mustreadalaska.com/feed/

  - id: kodiakdailymirror
    name: Kodiak Daily Mirror
    homepage: https://www.kodiakdailymirror.com/
    type: rss
    url: https://www.kodiakdailymirror.com/search/?f=rss&t=article&l=50&s=start_time&sd=desc

  - id: youralaskalink
    name: Your Alaska Link
    homepage: https://www.youralaskalink.com/
    type: rss
    url: https://www.youralaskalink.com/search/?f=rss&t=article&l=50&s=start_time&sd=desc
